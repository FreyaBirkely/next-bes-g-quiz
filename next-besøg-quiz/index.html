<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz time</title>
    <link rel="stylesheet" href="css/main.css">
    <script src="quiz.js" defer></script>
    <!-- <script src="svar_validering.js" defer></script> -->
</head>

<body>

    <section class="question">
        <h1 class="question__title">
            Webudvikler quiz
        </h1>

        <div class="error" id="error"></div>
        <div class="container">
            <h2 class="question__h2">Hvad står HTML for?</h2>
            <ul class="question__ul">
                <li>
                    <button class="question__btn true">Hypertext Markup Language</button>
                </li>
                <li>
                    <button class="question__btn false">HighText Machine Language</button>
                </li>
                <li>
                    <button class="question__btn false">HyperTool Multi Language</button>
                </li>
                <li>
                    <button class="question__btn false">Home Tool Markup Language</button>
                </li>
            </ul>
        </div>



        <div class="container">
            <h2 class="question__h2">Hvad bruges CSS primært til?</h2>
            <ul class="question__ul">
                <li>
                    <button class="question__btn false">At oprette databaser</button>
                </li>
                <li>
                    <button class="question__btn true">At style hjemmesider</button>
                </li>
                <li>
                    <button class="question__btn false">At håndtere servere</button>
                </li>
                <li>
                    <button class="question__btn false">At skrive HTML-kode</button>
                </li>
            </ul>
        </div>

        <div class="container">
            <h2 class="question__h2">Hvad bruges JavaScript typisk til på en hjemmeside</h2>
            <ul class="question__ul">
                <li>
                    <button class="question__btn false">At gemme billeder</button>
                </li>
                <li>
                    <button class="question__btn false">At erstatte internettet</button>
                </li>
                <li>
                    <button class="question__btn true">At skabe interaktivitet</button>
                </li>
                <li>
                    <button class="question__btn true">At give elever hovedpine</button>
                </li>
            </ul>
        </div>

        <div class="container">
            <h2 class="question__h2">Hvad er en API's primære funktion i webudvikling?</h2>
            <ul class="question__ul">
                <li>
                    <button class="question__btn false">At gøre billeder mindre</button>
                </li>
                <li>
                    <button class="question__btn false">At beskytte skærmen mod virus</button>
                </li>
                <li>
                    <button class="question__btn false">At definere hjemmesidens farver</button>
                </li>
                <li>
                    <button class="question__btn true">Kommunikere imellem forskellige systemer</button>
                </li>
            </ul>
        </div>

        <div class="container">
            <h2 class="question__h2">Hvad betyder responsivt webdesign?</h2>
            <ul class="question__ul">
                <li>
                    <button class="question__btn false">At hjemmesiden kun virker på computere</button>
                </li>
                <li>
                    <button class="question__btn  true">At hjemmesiden automatisk tilpasser sig forskellige
                        skærmstørrelser</button>
                </li>
                <li>
                    <button class="question__btn false">At hjemmesiden indlæses hurtigere</button>
                </li>
                <li>
                    <button class="question__btn false">At hjemmesiden ikke bruger CSS</button>
                </li>
            </ul>
        </div>

    </section>

</body>

</html>
